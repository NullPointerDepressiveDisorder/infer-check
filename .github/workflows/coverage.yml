name: Run tests and upload coverage

on: push

permissions:
  contents: read

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: 'true'
          activate-environment: "true"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests with coverage
        run: >-
          uv run pytest --cov=src/infer_check
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --junitxml=junit.xml -o junit_family=legacy

      - name: Run Mypy
        run: uv run mypy src --cobertura-xml-report mypy_report

      - name: Upload mypy coverage
        uses: codecov/codecov-action@v7.1.1
        if: "!cancelled()"
        with:
          files: ./mypy_report/cobertura.xml
          flags: mypy
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: 'true'

      - name: Upload pytest cov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.xml
          disable_search: true
          flags: pytest
          slug: ${{ github.repository }}
          fail_ci_if_error: 'true'
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./junit.xml
          report_type: test_results
          slug: ${{ github.repository }}
          fail_ci_if_error: 'true'
          token: ${{ secrets.CODECOV_TOKEN }}
